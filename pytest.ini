[pytest]
# Root `pytest` used to fail during collection: it walked into `server/`, whose
# Django tests need a dependency the desktop venv does not have, and `app` was
# not importable because bare `pytest` does not put the project root on
# sys.path the way `python -m pytest` does. Scope collection to the desktop
# suite and pin the import root.
testpaths = tests
pythonpath = .
norecursedirs =
    .git
    .venv
    .pytest_cache
    .ruff_cache
    __pycache__
    build
    data
    dist
    dist-*
    models
    output
    server
